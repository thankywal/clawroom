<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Council — everyone brings their own agent</title>
<!-- ORIGIN_TRIAL_TOKEN_SLOT -->
<link rel="stylesheet" href="./app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='4' y='2' width='8' height='7' fill='%233fa9ac'/><rect x='4' y='9' width='2' height='4' fill='%233fa9ac'/><rect x='7' y='9' width='2' height='5' fill='%233fa9ac'/><rect x='10' y='9' width='2' height='4' fill='%233fa9ac'/></svg>">
</head>
<body>
<div class="wrap">

  <header>
    <svg width="32" height="32" viewBox="0 0 16 16" aria-label="Council">
      <g fill="#3fa9ac">
        <rect x="4" y="2" width="8" height="6.6"/>
        <rect x="1"   y="4.6" width="1.5" height="3.2"/><rect x="2.5" y="6.2" width="1.6" height="1.6"/>
        <rect x="13.5" y="4.6" width="1.5" height="3.2"/><rect x="11.9" y="6.2" width="1.6" height="1.6"/>
        <rect x="3.6" y="8.6" width="1.6" height="3"/><rect x="2.4" y="10.4" width="1.5" height="2"/>
        <rect x="6"   y="8.6" width="1.5" height="4.2"/>
        <rect x="8.5" y="8.6" width="1.5" height="4.2"/>
        <rect x="10.8" y="8.6" width="1.6" height="3"/><rect x="12.1" y="10.4" width="1.5" height="2"/>
      </g>
      <rect x="5.9" y="4.3" width="1.3" height="1.3" fill="#0d1313"/>
      <rect x="8.8" y="4.3" width="1.3" height="1.3" fill="#0d1313"/>
    </svg>
    <h1>Council</h1>
  </header>
  <p class="tag"><b>Everyone brings their own agent.</b> Private preferences. Public decisions.</p>

  <div class="bar" id="bar"></div>

  <div class="grid">

    <section class="zone priv">
      <div class="zhead">
        <h2>🔒 My agent</h2>
        <span class="note">localStorage · never synced</span>
      </div>
      <div class="zbody" id="privBody"></div>
    </section>

    <section class="zone">
      <div class="zhead">
        <h2>🌐 Council</h2>
        <span class="note">shared with everyone</span>
      </div>
      <div class="zbody">
        <table>
          <thead><tr><th>Option</th><th>Dates</th><th>Price</th><th>Verdicts</th></tr></thead>
          <tbody id="optRows"></tbody>
        </table>
        <div id="outcome"></div>
      </div>
    </section>

  </div>

  <section id="timeline">
    <div class="zhead"><h2>Activity</h2><span class="note">🔒 local · 🌐 shared · ✋ human</span></div>
    <div id="feed"></div>
  </section>

</div>
<script type="module" src="./js/ui.js"></script>
</body>
</html>
