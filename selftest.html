<style>
  .case{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
  .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:9px 12px;background:var(--panel2);font-family:var(--mono);font-size:12.5px}
  .ch .nm{font-weight:650}
  .ch .zn{color:var(--dimmer);font-size:11px}
  .cb{padding:9px 12px;font-family:var(--mono);font-size:11.5px;color:var(--dim);
      white-space:pre-wrap;word-break:break-word;background:#0b1212}
  .verdict{font-weight:700}
  .verdict.p{color:var(--ok)} .verdict.f{color:var(--bad)}
  .dim{color:var(--dim)}
  #tally{font-family:var(--mono);font-size:14px;padding:12px 14px;border-radius:9px;
         border:1px solid var(--line2);background:var(--panel);margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap" style="max-width:840px">
  <header>
    <svg width="30" height="30" viewBox="0 0 16 16" aria-hidden="true"><g fill="#3fa9ac">
      <rect x="4" y="2" width="8" height="6.6"/>
      <rect x="1" y="4.6" width="1.5" height="3.2"/><rect x="2.5" y="6.2" width="1.6" height="1.6"/>
      <rect x="13.5" y="4.6" width="1.5" height="3.2"/><rect x="11.9" y="6.2" width="1.6" height="1.6"/>
      <rect x="3.6" y="8.6" width="1.6" height="3"/><rect x="6" y="8.6" width="1.5" height="4.2"/>
      <rect x="8.5" y="8.6" width="1.5" height="4.2"/><rect x="10.8" y="8.6" width="1.6" height="3"/>
    </g><rect x="5.9" y="4.3" width="1.3" height="1.3" fill="#0d1313"/>
    <rect x="8.8" y="4.3" width="1.3" height="1.3" fill="#0d1313"/></svg>
    <h1>Tool self-test</h1>
  </header>
  <p class="tag" style="margin-left:42px">Every ClawRoom tool, invoked through
    <b>document.modelContext.executeTool()</b> with no agent involved. Two of these
    check the product's claim rather than a function: that a private draft never
    reaches shared state, and that a commit changes nothing until a person approves.</p>

  <div id="tally">running</div>
  <div id="cases"></div>
</div>
<script type="module" src="/src/ui/selftest.ts"></script>
